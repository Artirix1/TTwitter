<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="Imagens/ejcmLogo.png" />

    <title>Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="logo">
        <img src="Imagens/Logo TT.png" alt="Logo do TTwitter" />
    </div>
    <main class="boxLogin">
        <div class="textContainer">
            <h1>Bem vindo a plataforma <br> TTwiter</h1>
            <form class="formulario" action="" method="post">
                <div class="emailInput">
                    <label for="email"> E-mail</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required /> <br>
                </div>

                <div class="senhaInput">
                    <label for="senha"> Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="•••••••••" required /> <br>
                </div>

                <button class="botaoEntrar">Entrar</button>

            </form>
            <a href="cadastro.html" class="botaoRegistrar">Registrar</a>

            <p class="termosDeUso">Li e estou de acordo com os <a href="">Termos</a> e <a href="">Condições de uso</a></p> <br>

        </div>
    </main>
</body>

</html>

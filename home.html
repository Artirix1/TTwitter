<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/png" href="Imagens/ejcmLogo.png" />

    <title>Home</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header class="header">
        <div class="logo">
            <img src="Imagens/Logo TT.png" alt="Logo do TTwitter">
        </div>

        <div class="barraDeBusca">
            <input type="search" placeholder="Buscar" aria-label="Barra de busca do TTwiter">
        </div>
    </header>

    <main class="feedContainer">
        <section class="recomendados">
            <h2>Talvez você conheça</h2>

            <ul class="listaPerfis">
                <li>
                    <div class="fotoPerfil"></div>
                    <p class="nomeUsuario">@usuário</p>
                </li>
                <li>
                    <div class="fotoPerfil"></div>
                    <p class="nomeUsuario">@usuário</p>
                </li>
            </ul>
        </section>

        <section class="publicarContainer">
            <form>
                <div class="caixaDePublicacao">
                    <textarea placeholder="No que está pensando...?"></textarea>
                </div>

                <div class="iconesPublicacao">
                    <img src="Imagens/pictureIcon.png" alt="Adicionar imagem">
                    <img src="Imagens/carinhaIcon.png" alt="Adicionar emoji">
                    <img src="Imagens/linkIcon.png" alt="Adicionar link">
                </div>
                <button class="botaoPostar">Postar</button>
            </form>
        </section>

        <article class="feed">
            <div class="imagemPost">
                <img src="Imagens/imagemPost.png" alt="Post no feed da Home">
            </div>
        
            <div class="descricaoPost">
                <div class="descricaoUsuario">
                    <div class="fotoPerfilPequena"></div>
                    <p class="nomeUsuarioPequeno">@usuario</p>
                </div>
            
                <div class="interacoes">
                    <img src= "Imagens/comentarIcon.png" alt= "Comentar">
                    <img src= "Imagens/likeIcon.png" alt= "Curtir">
                    <img src= "Imagens/ameiIcon.png" alt= "Amar">
                </div>
            </div>
        
            <div class="textoPost">
                <p>Lorem ipsum Lorem ipsum Lorem ipsum Lorem ipsum Lorem ipsum</p>
            </div>
        </article>
    </main>
</body>
</html>
